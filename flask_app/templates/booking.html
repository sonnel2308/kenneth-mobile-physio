<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Optimal Motion Physiotherapy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/booking.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    {% include 'components/navbar.html' %}

    <!-- Booking Form Section -->
    <section id="booking-form-container" class="booking-section section-padding">
        <div class="container">
            <div class="form-card">
                <h2 class="text-center mb-4">Schedule Consultation</h2>
                <p class="text-center mb-5">Please fill in your details below to book your appointment with our expert physiotherapists.</p>
                
                <!-- Form structure -->
                <form action="/book-appointment" method="POST" class="booking-form">
                    <div class="form-group">
                        <label for="full_name">Full Name <span class="required">*</span></label>
                        <input type="text" id="full_name" name="full_name" class="form-control" required placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone_number">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="phone_number" name="phone_number" class="form-control" required placeholder="(04) XXX XXX XXX">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="postcode">Postcode <span class="required">*</span></label>
                        <input type="text" id="postcode" name="postcode" class="form-control" required placeholder="e.g. 2000">
                    </div>
                    
                    <div class="form-group">
                        <label for="relationship">Relationship to Service Recipient <span class="required">*</span></label>
                        <select id="relationship" name="relationship" class="form-control" required>
                            <option value="" disabled selected>Select your relationship</option>
                            <option value="myself">For myself</option>
                            <option value="family_member">Family member</option>
                            <option value="friend">Friend</option>
                            <option value="allied_community_health">Allied community health professional</option>
                            <option value="general_practitioner">General practitioner</option>
                            <option value="support_at_home_package_manager">Support at home package manager</option>
                            <option value="ndis_planner_support_coordinator">NDIS planner - support coordinator</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="time">Preferred Visit Time <span class="required">*</span></label>
                        <select id="time" name="time" class="form-control" required>
                            <option value="" disabled selected>Select your preferred time</option>
                            <option value="morning">Morning (9am - 12pm)</option>
                            <option value="afternoon">Afternoon (1pm - 5pm)</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-large mt-4">Submit Booking Request</button>
                    
                    <p class="disclaimer mt-4">We respect your privacy. Your details will only be used for booking purposes.</p>
                </form>
            </div>
        </div>
    </section>

    {% include 'components/footer.html' %}
    <script>
        // Simple script to handle the CTA button on the nav bar when on the booking page
        document.querySelector('.cta-button-nav').setAttribute('href', '/booking');
    </script>
</body>
</html>
